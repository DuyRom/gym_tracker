name: Build Android APK

on:
  push:
    branches: [ main ]
    # Không chạy CI khi chỉ thay đổi tài liệu, Docker hoặc config VPS
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'server/**'
      - 'compose*.yml'
      - 'common.yml'
      - 'prod.yml'
      - 'start.sh'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

# Tự động hủy build cũ nếu push commit mới liên tiếp (tiết kiệm số phút GitHub Free)
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # Tối ưu bộ nhớ GitHub Free:
      # 1. retention-days: 2 -> Tự động xóa file sau 2 ngày để không chạm trần 500MB quota.
      # 2. compression-level: 9 -> Nén tối đa dung lượng artifact.
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymTracker-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
