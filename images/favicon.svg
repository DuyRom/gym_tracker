<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </radialGradient>
    
    <!-- Neon Cyan-Emerald Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Metal Steel Gradient for Barbell -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Subtle grid lines in background -->
  <path d="M128 40 L128 472 M256 40 L256 472 M384 40 L384 472 M40 128 L472 128 M40 256 L472 256 M40 384 L472 384" 
        stroke="rgba(6, 182, 212, 0.05)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Ambient Glow Behind Weight -->
  <circle cx="256" cy="256" r="140" fill="url(#neonGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Diagonal Dumbbell Icon (Tech Athletic) -->
  <g transform="rotate(-35 256 256)">
    <!-- Central Barbell Shaft -->
    <rect x="236" y="96" width="40" height="320" rx="8" fill="url(#metalGrad)"/>
    <!-- Knurling texture on grip -->
    <line x1="242" y1="210" x2="270" y2="210" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="230" x2="270" y2="230" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="250" x2="270" y2="250" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="270" x2="270" y2="270" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="290" x2="270" y2="290" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

    <!-- Inner Collar Stops -->
    <rect x="220" y="170" width="72" height="16" rx="4" fill="#94A3B8"/>
    <rect x="220" y="326" width="72" height="16" rx="4" fill="#94A3B8"/>

    <!-- Top Plate Stack (Glowing Neon + Sleek Weight Plates) -->
    <!-- Large Plate -->
    <rect x="180" y="142" width="152" height="24" rx="8" fill="url(#neonGrad)" filter="url(#glow)"/>
    <rect x="180" y="142" width="152" height="24" rx="8" fill="url(#neonGrad)"/>
    <!-- Medium Plate -->
    <rect x="196" y="112" width="120" height="22" rx="7" fill="url(#neonGrad)"/>
    <!-- Small End Cap -->
    <rect x="226" y="90" width="60" height="16" rx="6" fill="#F1F5F9"/>

    <!-- Bottom Plate Stack -->
    <!-- Large Plate -->
    <rect x="180" y="346" width="152" height="24" rx="8" fill="url(#neonGrad)" filter="url(#glow)"/>
    <rect x="180" y="346" width="152" height="24" rx="8" fill="url(#neonGrad)"/>
    <!-- Medium Plate -->
    <rect x="196" y="378" width="120" height="22" rx="7" fill="url(#neonGrad)"/>
    <!-- Small End Cap -->
    <rect x="226" y="406" width="60" height="16" rx="6" fill="#F1F5F9"/>
  </g>

  <!-- Accent Energy Sparks -->
  <circle cx="390" cy="120" r="6" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="110" cy="380" r="5" fill="#10B981" filter="url(#glow)"/>
</svg>
