name: gym-tracker

services:
  db:
    image: mariadb:11.2
    container_name: gym-tracker-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-gym_tracker}
      MYSQL_USER: ${DB_USER:-gym_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-tracker-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-gym_user}:${DB_PASSWORD}@db:3306/${DB_NAME:-gym_tracker}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://fit.odinbi.app}
      PORT: 3000
    volumes:
      - ./public/images:/app/public/images
    networks:
      - internal-net

  server:
    image: nginx:alpine
    container_name: gym-tracker-nginx
    restart: unless-stopped
    volumes:
      - ./server/nginx/conf.d/nginx.common.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal-net
      - proxy-net

networks:
  internal-net:
    driver: bridge
  proxy-net:
    external: true

volumes:
  mariadb_data:
    driver: local
