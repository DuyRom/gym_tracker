services:
  app:
    image: odbadmin/fit:${FIT_IMAGE_TAG:-latest}
    networks:
      - default
      - proxy-net

  server:
    image: nginx:alpine
    container_name: gym-tracker-nginx
    restart: always
    volumes:
      - ./server/nginx/conf.d/nginx.common.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - default
      - proxy-net

networks:
  proxy-net:
    external: true
  default:
    external: false
